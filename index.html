<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="assets/script.js" defer></script>
</head>

<body>
    <main>
        <section class="container my-4"> <!--sezione con i membri del team-->
            <h1 class="text-uppercase text-center mb-5">Meet Our Team</h1> <!--titolo della sezione-->
            <p class="text-center">Esperienza, metodo e dedizione: il motore della nostra crescita</p>
            <!--sottotitolo della sezione-->
            <ul class="team-list g-4 row row-cols-1 row-cols-sm-2 list-unstyled mt-5"></ul>
            <!--lista dei membri del team-->
        </section>

        <section class="container my-5 text-center"> <!--sezione con il form-->
            <h2 class="h4 text-center pt-3">Add a new member</h2> <!--titolo del form-->
        </section>

        <form class="team-form text-center"> <!--form per aggiungere un nuovo membro-->
            <div class="mb-3"> <!--campo per il nome-->
                <label for="name" class="form-label">Name</label> <!--etichetta del campo nome-->
                <input type="text" class="form-control mx-auto w-50" id="name" required> <!--campo per il nome-->
            </div>
            <div class="mb-3"> <!--campo per il ruolo-->
                <label for="role" class="form-label">Role</label> <!--etichetta del campo ruolo-->
                <input type="text" class="form-control mx-auto w-50" id="role" required> <!--campo per il ruolo-->
            </div>
            <div class="mb-3"> <!--campo per l'email-->
                <label for="email" class="form-label">Email</label> <!--etichetta del campo email-->
                <input type="email" class="form-control mx-auto w-50" id="email" required> <!--campo per l'email-->
            </div>
            <div class="mb-3"> <!--campo per l'immagine-->
                <label for="img" class="form-label">Image</label> <!--etichetta del campo immagine-->
                <input type="text" class="form-control mx-auto w-50" id="img" required> <!--campo per l'immagine-->
            </div>
            <button type="submit" class="btn btn-primary">Submit</button> <!--bottone per aggiungere il membro-->
        </form>
    </main>
</body>


</html>
