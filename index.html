<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="assets/script.js" defer></script>
</head>

<body>
    <main>
        <section class="container my-4">
            <h1 class="text-uppercase text-center mb-5">Meet Our Team</h1>
            <p class="text-center">Esperienza, metodo e dedizione: il motore della nostra crescita</p>
            <ul class="team-list g-4 row row-cols-1 row-cols-sm-2 list-unstyled mt-5"></ul>
        </section>

        <section class="container my-5 text-center">
            <h2 class="h4 text-center pt-3">Add a new member</h2>
        </section>

        <form class="team-form text-center">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control mx-auto w-50" id="name" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <input type="text" class="form-control mx-auto w-50" id="role" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control mx-auto w-50" id="email" required>
            </div>
            <div class="mb-3">
                <label for="img" class="form-label">Image</label>
                <input type="text" class="form-control mx-auto w-50" id="img" required>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </main>
</body>


</html>
